name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.compiler }} ${{ matrix.flavour }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        compiler: [g++, clang++]
        flavour: [release]
        include:
          - os: ubuntu-24.04
            compiler: g++
            flavour: sanitizers
            cmake_args: -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
          - os: ubuntu-24.04
            compiler: g++
            flavour: headless
            cmake_args: -DLAUNCHER_BUILD_GUI=OFF
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev libcurl4-openssl-dev

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} ${{ matrix.cmake_args }}
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
